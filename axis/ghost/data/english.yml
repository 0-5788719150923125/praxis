  - too
  - also
  - just
  - only
  - very
  - up
  - out
  - off
  - down

# ---------------------------------------------------------------- clitics
#
# Split at the apostrophe: the HEAD goes through this same pipeline, the
# clitic appends. Contractions whose head changes shape (don't, won't, can't)
# are whole-word lexicon entries above instead.
clitics:
  "n't": AH N T
  "'re": ER
  "'ve": V
  "'ll": L
  "'d": D
  "'m": M

# ---------------------------------------------------------------- suffixes
#
# Each entry: the spelling, how to rebuild the stem, and what to append.
# `voiced_split` picks by the last phone of the stem, which is why the stem has
# to be pronounced FIRST - the letter rules cannot know whether the `d` of
# `watched` is a syllable without knowing the stem ends in a /tsh/.
#
#   add     - phones appended unconditionally
#   split   - {after: [phones], use: [...]} chosen by the stem's last phone
#   undouble- drop a doubled final consonant from the stem (stopped -> stop)
#   restore_e - try the stem with a final `e` first (hoping -> hope)
suffixes:
  - spelling: ing
    add: [IH, NG]
    undouble: true
    restore_e: true
  - spelling: ed
    undouble: true
    restore_e: true
    syllabic_after: [T, D]
    syllabic: [IH, D]
    voiceless_after: [P, K, F, TH, S, SH, HH]
    voiceless: [T]
    otherwise: [D]
  - spelling: ly
    add: [L, IY]
  - spelling: ness
    add: [N, AH, S]
  - spelling: ment
    add: [M, AH, N, T]
  - spelling: ful
    add: [F, AH, L]
