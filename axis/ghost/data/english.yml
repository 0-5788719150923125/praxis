# English pronunciation data for the [Phonemes] front end.
#
# This file is DATA, not configuration - it is the language, and it is external
# so it can be read, diffed and corrected without touching the synthesizer.
# Phoneme keys are the ones in Phonemes.TABLE (ARPABET-ish). CH and JH are
# written as-is here and expanded to T SH / D ZH on load.
#
# Order of application in Phonemes.word_to_phones:
#   1. lexicon        - exact word, wins outright
#   2. suffixes       - strip, pronounce the STEM through this same pipeline,
#                       reattach with the suffix's own rule
#   3. letter rules   - digraphs, magic-e, silent e, singles (in phonemes.gd)
#
# English's most frequent words are also its most irregular, so the lexicon is
# where the intelligibility is: letter rules cannot get `we`, `head`, `one` or
# `because` right, and those are the words a listener leans on hardest.

# ---------------------------------------------------------------- lexicon
lexicon:
  # WHAT BELONGS HERE, now that CMUdict answers 126k words: only the places we
  # disagree with the dictionary ON PURPOSE. 387 of the previous 414 entries
  # were byte-identical to CMUdict, and because they carried no stress digits
  # they OVERRODE the dictionary's stress with "primary on the first vowel" -
  # mis-stressing about, because, before, between, again and 51 other very
  # common words. A redundant override is not free; it is a silent regression.
  #
  # Reduced narrator forms do NOT belong here either. CMUdict lists function
  # words in their citation shape (`has` as HH AE1 Z), and the fix is to strip
  # the STRESS, not to rewrite the vowel: `function_words` below forces stress
  # 0, and the existing per-syllable reduction then centralizes the vowel and
  # shortens it at synthesis time. Spelling the reduced vowel out here would
  # duplicate that machinery and freeze one degree of reduction for every
  # speaker and every tempo.
  #
  # Stress digits are required on anything polysyllabic. 0 unstressed,
  # 1 primary, 2 secondary, exactly as CMUdict writes them.

  # Homographs. Neither reading is wrong; without part-of-speech tagging the
  # system must pick one, and these pick the reading commoner in narrative
  # prose - `live` as the verb ("I live upstairs") over the adjective, which is
  # what CMUdict ships. Documented so a wrong one is a known cost, not a bug.
  live: L IH1 V
  lives: L IH1 V Z

  # Not in CMUdict at all.
  archiving: AA1 R K AY0 V IH0 NG
  narrating: N EH1 R EY0 T IH0 NG

# ---------------------------------------------------------------- function words
# ---------------------------------------------------------------- names
# INVENTED WORDS AND PROPER NOUNS - the things no dictionary has and no
# letter-to-sound rule can be expected to get right.
#
# This is the anti-whack-a-mole list. Anything here is spoken EXACTLY as written
# below, in every mode, and it outranks the neural backend's own guess: entries are
# marked `literal`, which is what makes ghost's phones beat eSpeak's transcription
# for that one word while leaving the rest of the sentence untouched. Adding a word
# here needs no code change and no rebuild.
#
# HOW TO WRITE ONE. ARPAbet, space separated, with a stress digit on the vowel that
# carries the accent: 1 primary, 2 secondary, 0 unstressed. The vowels are
# AA AE AH AO AW AY EH ER EY IH IY OW OY UH UW; the consonants are the obvious
# letters plus CH JH SH ZH TH DH NG Y W R L HH. So `B IY1 UW0 K S` reads BEE-ooks,
# stressed on the first syllable.
#
# HOW TO CHECK ONE. `tests/pronounce_audit.gd` reads a script and reports every word
# it considers risky, this list included, so a chapter can be audited before it is
# rendered rather than after it is heard.
#
# A word can also be overridden inline in the script itself as `[B IY1 UW0 K S]`,
# which wins over everything here - use that for a one-off, and this list for
# anything that recurs.
names:
  # From north-star chapter 15, which is the only chapter carrying invented words.
  # eSpeak reads these as `bˌaɪoʊˈʌks` (by-oh-UKS) and `ˈɛndʒˌændɪdʒˈɑːɹɹə` - note
  # that the second one spells the leading N out loud as the letter "en", which is
  # not a plausible reading of anything.
  #
  # THESE TWO ARE JUDGEMENT CALLS, not measurements, because the words belong to
  # somebody else's invented universe and there is no authority to check them
  # against. Both are the most natural English reading of the spelling. If either is
  # wrong, this line is the only place that needs changing.
  #   biouks    BEE-ooks       (the alternative reading is BYE-ohks: B AY1 OW0 K S)
  #   njandejara nyahn-deh-JAH-ruh, treating Nj- as the prenasalized palatal it
  #             looks like, rather than as a spelled-out letter
  biouk: B IY1 UW0 K
  biouks: B IY1 UW0 K S
  njandejara: N Y AA0 N D EH0 JH AA1 R AH0

#
# Words that carry no sentence accent in English. [Phrasing] reduces them and
# never places a nucleus on one. The built-in list in phonemes.gd was 33 entries
# and missed most auxiliaries and pronouns, so `has`, `will` and `we` were being
# read as content words and taking accents that belong to the verb.
function_words:
  - the
  - a
  - an
  - of
  - to
  - in
  - on
  - at
  - by
  - for
  - and
  - or
  - but
  - nor
  - so
  - if
  - as
  - than
  - then
  - that
  - this
  - these
  - those
  - with
  - from
  - into
  - onto
  - upon
  - over
  - under
  - about
  - after
  - before
  - is
  - are
  - was
  - were
  - be
  - been
  - being
  - am
  - has
  - have
  - had
  - do
  - does
  - did
  - will
  - would
  - shall
  - should
  - can
  - could
  - may
  - might
  - must
  - it
  - its
  - i
  - me
  - my
  - you
  - your
  # NOTE: the standalone possessives (mine, yours, ours, theirs, hers) are
  # deliberately NOT here - they are predicates that carry focus, as in
  # "the far end is YOURS", and listing them moved that nucleus onto `end`.
  - he
  - him
  - his
  - she
  - her
  - we
  - us
  - our
  - they
  - them
  - their
  - there
  - here
  - who
  - whom
  - whose
  - which
  - what
