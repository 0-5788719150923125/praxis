# Section 3.1, byte-latent variant: the run uses a BLT-style byte encoder, not a
# reconstructing codec. calm-e and the abstractinator family are here.
#
# ACCURACY NOTE (2026-07-30): this fragment used to say the stream is cut "at
# points of high next-byte entropy." That is the BLT paper's headline mechanism
# and it is what the patcher supports, but every byte-latent profile in
# ENCODER_REGISTRY (ByteLatentTransformer, Abstractinator and its harmonic
# variants) sets patching_mode="space", and no experiment overrides it - so the
# runs actually cut on whitespace, per the BLT reference's space patcher. The
# prose now describes the boundary rule the runs use. If a profile ever selects
# entropy patching, this fragment needs a patching_mode gate rather than an edit.
section: harmonic
order: 10
requires:
  codec_mode: [byte_latent]
body: >
  \subsection{Entropy patching and the corpus beat}

  This run reads raw bytes through a byte-latent encoder~\cite{pagnoni2024byte}:
  the stream is segmented into variable-length patches at boundaries the data
  itself supplies - whitespace, in the configuration we run, so a patch is
  roughly a word - and each patch is compressed through a bottleneck to a single
  vector the global transformer then operates on. There is no reconstructing
  codec here and no per-patch latent to phase-lock, but the same geometry appears
  one level up. Because the boundaries follow the content rather than a fixed
  stride, the patch stream already carries the corpus's own cadence: patches vary
  in length exactly where the text does, and the sequence of patch vectors is a
  rhythm read off the data instead of imposed on it. The harmonic head then
  writes its standing wave over those patch features, and the bias/variance
  reading is unchanged - a static spectrum is the average patch rhythm, an
  input-conditional modulation is the structured deviation. Where a
  continuous-latent codec phase-locks its latent to the beat, the byte-latent
  encoder lets the beat fall out of where it chose to cut.
