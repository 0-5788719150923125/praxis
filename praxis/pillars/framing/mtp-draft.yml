# Opens the multi-token subsection whenever ANY mtp_type is configured - the
# intro claims here (K losses off one state, speculative drafting, the
# lossless truncated-prefix verify) are true of every MTP variant; everything
# mechanism-specific lives in the order-14 fragments (one per mtp_type), and
# the shared "short curve" reading + fox figure follow at order 15
# (mtp-draft-window). Follows the harmonic-bottleneck addendum (order 12): the
# bottleneck fragment says what the codes are; this family says what the head
# does with the stream.
#
# ACCURACY NOTE (2026-07-30): this paragraph used to describe K per-depth
# transforms that are "near-copies of one another" and "share their
# parameters". That is true of vear (sliding-window merge over a shared pool)
# and false everywhere else - transformer and conv build K INDEPENDENT modules
# that share nothing, and serpent_rnn does not build K transforms at all (one
# gated cell, unrolled, params O(1) in depth). Read alongside the Gloeckle
# citation, it told every reader the draft head was a stack of small
# transformer blocks. The parameter-sharing argument now lives in the
# per-mechanism fragments, each stating what its own bank does.
section: harmonic
order: 13
requires:
  mtp_type: "*"
body: >
  \subsubsection*{Prediction as a short curve: the multi-token draft}

  This run also trains a byte-level multi-token head~\cite{gloeckle2024mtp}:
  beside the next byte, the next $K$ bytes are read off the same trunk state,
  each at its own draft depth, and each depth chaining on the one before it
  rather than reading the trunk independently. How those depths are realized
  is a choice the framework leaves open, and it is the next paragraph's
  subject; what the choices have in common is the constraint that adjacent
  depths predict adjacent positions, so a bank that spends independent
  capacity per depth is relearning a correlation the task already supplies.
  At inference the draft is
  speculative~\cite{leviathan2023fast}: up to $K{+}1$ bytes land per two
  full forwards, and greedy decode is exact. Exactness is not free here -
  byte-latent patching is non-causal within a partial patch, so an appended
  draft byte can shift earlier predictions - and the verify pass earns it by
  reading each truncated prefix at its own last position, where nothing
  follows to contaminate the read; sampled decoding accepts drafts by match
  against a fresh sample and remains approximate.
